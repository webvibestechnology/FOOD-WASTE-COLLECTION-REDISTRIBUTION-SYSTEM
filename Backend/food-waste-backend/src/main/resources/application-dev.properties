# Development Environment Configuration
# Copy this file to application.properties and set actual values

spring.application.name=food-waste-backend

# Database Configuration - Development
spring.datasource.url=jdbc:mysql://localhost:3306/food_waste_db
spring.datasource.username=root
spring.datasource.password=your_dev_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - Development (use a strong secret in production)
jwt.secret=dev_secret_key_change_in_production_minimum_32_chars
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
